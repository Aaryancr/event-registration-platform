global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "eventflow-backend"
    metrics_path: "/api/v1/metrics"
    scheme: "http"
    authorization:
      type: "Bearer"
      credentials: "eventflow-metrics-token-secure"
    static_configs:
      - targets: ["backend:8000"]
        labels:
          app: "eventflow"
          environment: "production"
