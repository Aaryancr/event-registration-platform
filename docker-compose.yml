services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Environment variable POSTGRES_USER is required and cannot be empty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Environment variable POSTGRES_PASSWORD is required and cannot be empty}
      POSTGRES_DB: ${POSTGRES_DB:?Environment variable POSTGRES_DB is required and cannot be empty}
    ports:
      # Bind to loopback (127.0.0.1) to avoid exposing the database port to external networks
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume to persist database records across container recreations
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      # Bind to loopback (127.0.0.1) to protect Redis from external exposure
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Environment variable POSTGRES_USER is required and cannot be empty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Environment variable POSTGRES_PASSWORD is required and cannot be empty}
      POSTGRES_DB: ${POSTGRES_DB:?Environment variable POSTGRES_DB is required and cannot be empty}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET: ${JWT_SECRET:?Environment variable JWT_SECRET is required and cannot be empty}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      # Bind mount code for hot reloading in development
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      # Bind mount code for Vite hot module replacement
      - ./frontend:/app
      # Anonymous volume prevents host directory from overwriting container node_modules
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
